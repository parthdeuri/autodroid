name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Name the debug APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/autodroid-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: autodroid-debug
          path: app/build/outputs/apk/debug/autodroid-debug.apk

      - name: Build release APK (smaller, minified)
        continue-on-error: true
        run: gradle assembleRelease --stacktrace

      - name: Name the release APK
        continue-on-error: true
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/autodroid-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: autodroid-release
          path: app/build/outputs/apk/release/autodroid-release.apk
          if-no-files-found: warn
