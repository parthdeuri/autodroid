name: Release

# Push a tag like v1.1 to build the release APK and publish it on the Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Autodroid-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "Autodroid-${GITHUB_REF_NAME}.apk"             --title "Autodroid ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
